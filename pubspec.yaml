name: villaguest
description: ""
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  supabase_flutter: ^2.0.0

  # Estado
  provider: ^6.1.2

  # Utilidades
  intl: ^0.20.3                  # Formateo de fechas y monedas
  image_picker: ^1.1.2           # Para cámara/fotos (limpieza)
  url_launcher: ^6.2.1           # Abrir enlaces externos

  # Generación y descarga de PDFs (facturas)
  pdf: ^3.11.1
  printing: ^5.13.2
  http: ^1.6.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3


flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: false
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#092AC9"
    theme_color: "#17BA8D"
